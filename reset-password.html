<!doctype html>
<html lang="en-AE">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | AUREX</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="gallery.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js?v=2"></script>
  <style>
    .reset-wrap {
      max-width: 440px;
      margin: 70px auto;
      padding: 25px;
    }
    .reset-wrap input {
      width: 100%;
      padding: 13px;
      margin: 10px 0 18px;
      box-sizing: border-box;
    }
    .reset-wrap button {
      width: 100%;
      cursor: pointer;
    }
    #resetMessage {
      margin-top: 15px;
    }
  </style>
</head>
<body class="admin-body">

<header class="admin-top">
  <a class="brand" href="index.html">
    <img src="assets/aurex-logo.png" alt="AUREX logo">
    <span><b>AUREX</b><small>PASSWORD RESET</small></span>
  </a>
</header>

<main class="admin-wrap">
  <section class="admin-panel reset-wrap">
    <h1>Set New Password</h1>
    <p>Enter your new admin password below.</p>

    <form id="resetForm">
      <label>
        New password
        <input type="password" id="newPassword" minlength="8" required>
      </label>

      <label>
        Confirm new password
        <input type="password" id="confirmPassword" minlength="8" required>
      </label>

      <button class="btn gold" type="submit" id="resetButton">
        Update Password
      </button>
    </form>

    <p id="resetMessage" role="status"></p>
    <a href="admin.html">Back to Admin Login</a>
  </section>
</main>

<script>
(() => {
  const message = document.getElementById('resetMessage');
  const form = document.getElementById('resetForm');
  const button = document.getElementById('resetButton');

  if (!window.supabase || !window.AUREX_SUPABASE_URL ||
      !window.AUREX_SUPABASE_ANON_KEY) {
    message.textContent = 'Supabase configuration is missing.';
    button.disabled = true;
    return;
  }

  const db = window.supabase.createClient(
    window.AUREX_SUPABASE_URL,
    window.AUREX_SUPABASE_ANON_KEY
  );

  async function checkRecoverySession() {
    const { data, error } = await db.auth.getSession();

    if (error || !data.session) {
      message.textContent =
        'Reset link is invalid or expired. Please request a new password reset email.';
      button.disabled = true;
      return;
    }

    message.textContent = 'Enter your new password.';
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const password = document.getElementById('newPassword').value;
    const confirm = document.getElementById('confirmPassword').value;

    if (password.length < 8) {
      message.textContent = 'Password must be at least 8 characters.';
      return;
    }

    if (password !== confirm) {
      message.textContent = 'Passwords do not match.';
      return;
    }

    button.disabled = true;
    message.textContent = 'Updating password…';

    const { error } = await db.auth.updateUser({
      password: password
    });

    if (error) {
      message.textContent = error.message;
      button.disabled = false;
      return;
    }

    message.textContent = 'Password updated successfully. You can now log in.';
    form.reset();
    button.disabled = false;
  });

  checkRecoverySession();
})();
</script>

</body>
</html>
